<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./%VITE_LOGO_PATH%" />
  <title>Aceptación de Informe - %VITE_APP_NAME%</title>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; min-height: 100vh; background: linear-gradient(135deg, %VITE_PRIMARY_DARK% 0%, %VITE_PRIMARY_COLOR% 50%, %VITE_PRIMARY_COLOR% 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; color: #1a1a1a; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
    .page-wrap { width: 100%; max-width: 480px; }
    .logo-wrap { text-align: center; margin-bottom: 20px; }
    .logo-wrap img { width: 72px; height: 72px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.95); padding: 8px; }
    .card { background: rgba(255,255,255,0.98); border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); padding: 32px 28px; }
    .card-title { font-size: 1.5rem; font-weight: 700; color: #1a1a1a; margin: 0 0 6px; text-align: center; }
    .card-subtitle { text-align: center; color: #525252; font-size: 0.9rem; margin: 0 0 16px; }
    #id-info { text-align: center; font-size: 0.9rem; color: %VITE_PRIMARY_COLOR%; font-weight: 600; margin-bottom: 20px; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-weight: 600; font-size: 0.875rem; color: #374151; }
    input, select { width: 100%; padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 1rem; background: #fff; }
    input:focus, select:focus { outline: none; border-color: %VITE_PRIMARY_COLOR%; }
    .pad-wrap { border: 1px solid #e5e7eb; border-radius: 12px; margin: 8px 0; overflow: hidden; background: #fafafa; }
    canvas { display: block; width: 100%; height: 160px; touch-action: none; }
    .btn-clear { padding: 10px 18px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; background: #f3f4f6; color: #374151; }
    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, %VITE_PRIMARY_COLOR% 0%, %VITE_PRIMARY_COLOR% 100%); color: white; margin-top: 24px; }
    .btn-submit:hover:not(:disabled) { background: linear-gradient(135deg, %VITE_PRIMARY_COLOR% 0%, %VITE_PRIMARY_DARK% 100%); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .checkbox-wrap { margin: 20px 0; display: flex; align-items: flex-start; gap: 12px; }
    .checkbox-wrap input { width: auto; margin-top: 4px; accent-color: %VITE_PRIMARY_COLOR%; }
    .checkbox-wrap label { margin: 0; font-weight: 500; }
    #message { color: %VITE_PRIMARY_COLOR%; font-size: 0.9rem; margin-top: 10px; display: none; }
    #success { color: #15803d; font-size: 0.95rem; margin-top: 16px; font-weight: 500; display: none; }
    .download-wrap { margin-top: 16px; }
    .btn-download { display: inline-block; padding: 12px 20px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; background: #15803d; color: white; text-decoration: none; border: none; }
    .btn-download:hover { background: #166534; }
  </style>
</head>
<body>
  <div class="main">
    <div class="page-wrap">
      <div class="logo-wrap"><img src="./%VITE_LOGO_PATH%" alt="%VITE_APP_NAME%" onerror="this.style.display='none'" /></div>
      <div class="card">
        <h1 class="card-title">Aceptación de Informe</h1>
        <p class="card-subtitle">Firma electrónica del informe / presupuesto. Todos los campos son obligatorios.</p>
        <p id="id-info"></p>

        <form id="form">
          <label for="nombre_comunidad">Nombre de cliente / comunidad <span style="color:%VITE_PRIMARY_COLOR%">*</span></label>
          <input type="text" id="nombre_comunidad" required placeholder="Nombre o razón social" />

          <label for="cif">CIF <span style="color:%VITE_PRIMARY_COLOR%">*</span></label>
          <input type="text" id="cif" required placeholder="CIF / NIF" />

          <label for="direccion">Dirección <span style="color:%VITE_PRIMARY_COLOR%">*</span></label>
          <input type="text" id="direccion" required placeholder="Dirección completa" />

          <label for="nombre_representante">Nombre del representante <span style="color:%VITE_PRIMARY_COLOR%">*</span></label>
          <input type="text" id="nombre_representante" required placeholder="Nombre y apellidos" />

          <label for="cargo">Cargo <span style="color:%VITE_PRIMARY_COLOR%">*</span></label>
          <select id="cargo" required>
            <option value="">— Seleccione —</option>
            <option value="Presidente">Presidente</option>
            <option value="Administrador">Administrador</option>
            <option value="Secretario">Secretario</option>
            <option value="Otro">Otro</option>
          </select>

          <label for="email">Email <span style="color:%VITE_PRIMARY_COLOR%">*</span></label>
          <input type="email" id="email" required placeholder="correo@ejemplo.com" />

          <label for="telefono">Teléfono <span style="color:%VITE_PRIMARY_COLOR%">*</span></label>
          <input type="tel" id="telefono" required placeholder="Teléfono de contacto" />

          <label>Firma <span style="color:%VITE_PRIMARY_COLOR%">*</span></label>
          <div class="pad-wrap">
            <canvas id="signature-pad"></canvas>
          </div>
          <button type="button" class="btn-clear" id="btn-clear">Borrar firma</button>

          <div class="checkbox-wrap">
            <input type="checkbox" id="acepto" required />
            <label for="acepto">Acepto las condiciones del informe y autorizo el inicio de los trabajos según lo descrito.</label>
          </div>

          <div id="message"></div>
          <div id="success"></div>
          <div id="download-wrap" class="download-wrap" style="display:none;">
            <a id="btn-download-pdf" href="#" class="btn-download" download>Descargar informe firmado (PDF)</a>
          </div>
          <button type="submit" class="btn-submit" id="btn-submit">Firmar y aceptar</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var informeId = params.get('id') ? parseInt(params.get('id'), 10) : null;
      var API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:3000'
        : (window.location.origin || '%VITE_API_URL%');

      if (!informeId) {
        document.getElementById('id-info').textContent = 'No se ha indicado informe (falta ?id= en la URL).';
      } else {
        document.getElementById('id-info').textContent = 'Informe nº ' + informeId;
        fetch(API_BASE + '/api/informes-firma/' + informeId + '/datos-firma')
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(data) {
            if (data) {
              document.getElementById('id-info').textContent = 'Informe ' + (data.numero_informe || informeId);
              if (data.cliente_nombre) document.getElementById('nombre_comunidad').value = data.cliente_nombre;
              if (data.cif) document.getElementById('cif').value = data.cif;
              if (data.direccion) document.getElementById('direccion').value = data.direccion;
            }
          }).catch(function() {});
      }

      var canvas = document.getElementById('signature-pad');
      var ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = 180 * ratio;
      canvas.getContext('2d').scale(ratio, ratio);
      var signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(250, 250, 250)' });

      function allValid() {
        var nombre = document.getElementById('nombre_comunidad').value.trim();
        var cif = document.getElementById('cif').value.trim();
        var dir = document.getElementById('direccion').value.trim();
        var rep = document.getElementById('nombre_representante').value.trim();
        var cargo = document.getElementById('cargo').value;
        var email = document.getElementById('email').value.trim();
        var tel = document.getElementById('telefono').value.trim();
        return nombre && cif && dir && rep && cargo && email && tel && !signaturePad.isEmpty() && document.getElementById('acepto').checked;
      }
      function updateBtn() { document.getElementById('btn-submit').disabled = !allValid(); }
      document.getElementById('btn-clear').addEventListener('click', function() { signaturePad.clear(); updateBtn(); });
      signaturePad.addEventListener('endStroke', updateBtn);
      ['nombre_comunidad', 'cif', 'direccion', 'nombre_representante', 'cargo', 'email', 'telefono', 'acepto'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) { el.addEventListener('input', updateBtn); el.addEventListener('change', updateBtn); }
      });
      updateBtn();

      document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!informeId) { showMsg('Falta el identificador del informe en la URL.', true); return; }
        if (!allValid()) { showMsg('Complete todos los campos y firme.', true); return; }

        var payload = {
          informe_id: informeId,
          fecha_hora: new Date().toISOString(),
          nombre_comunidad: document.getElementById('nombre_comunidad').value.trim(),
          cif: document.getElementById('cif').value.trim(),
          direccion: document.getElementById('direccion').value.trim(),
          nombre_representante: document.getElementById('nombre_representante').value.trim(),
          cargo: document.getElementById('cargo').value,
          email: document.getElementById('email').value.trim(),
          telefono: document.getElementById('telefono').value.trim(),
          firma_base64: signaturePad.toDataURL('image/png')
        };

        var btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.textContent = 'Enviando...';
        showMsg('', true);
        showSuccess('', true);

        fetch(API_BASE + '/api/informes-firma/firmado', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function(res) {
          if (!res.ok) throw new Error('Error al registrar la firma');
          return res.json();
        }).then(function(data) {
          var msg = 'Informe aceptado y firmado correctamente.';
          if (data && data.pdf_base64) {
            try {
              var binary = atob(data.pdf_base64);
              var bytes = new Uint8Array(binary.length);
              for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
              var blob = new Blob([bytes], { type: 'application/pdf' });
              var url = URL.createObjectURL(blob);
              var fileName = 'informe-' + (data.informe_id || informeId) + '-firmado.pdf';
              var a = document.getElementById('btn-download-pdf');
              a.href = url;
              a.download = fileName;
              document.getElementById('download-wrap').style.display = 'block';
              a.click();
              msg += ' El documento de confirmación se ha descargado.';
            } catch (e) { msg += ' Puede descargar el PDF más abajo.'; }
          }
          if (data && data.email_enviado) msg += ' Se ha enviado una copia a su correo.';
          showSuccess(msg);
          btn.textContent = 'Completado';
        }).catch(function(err) {
          showMsg(err.message || 'Error al enviar. Compruebe la conexión.');
          btn.disabled = false;
          btn.textContent = 'Firmar y aceptar';
        });
      });

      function showMsg(t, hideOk) { var el = document.getElementById('message'); el.textContent = t; el.style.display = t ? 'block' : 'none'; if (hideOk) document.getElementById('success').style.display = 'none'; }
      function showSuccess(t, hideErr) { var el = document.getElementById('success'); el.textContent = t; el.style.display = t ? 'block' : 'none'; if (hideErr) document.getElementById('message').style.display = 'none'; }
    })();
  </script>
</body>
</html>
